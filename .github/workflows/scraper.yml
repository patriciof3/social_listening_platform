
name: Scrape Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs daily at 00:00 UTC

permissions:
  contents: read

jobs:
  scrape-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github_actions.txt

      - name: Set up Spanish locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen es_ES.UTF-8
          echo "LANG=es_ES.UTF-8" >> "$GITHUB_ENV"
          echo "LANGUAGE=es_ES:es" >> "$GITHUB_ENV"
          echo "LC_ALL=es_ES.UTF-8" >> "$GITHUB_ENV"

      - name: Run Scraper
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_scraper.py

      - name: Generate Daily Summaries
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_summaries.py

